name: Helm chart

on:
  pull_request:
    paths:
      - charts/**
      - .github/workflows/helm-release.yaml
  push:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/helm-release.yaml

concurrency:
  group: helm-chart-release
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ./charts/appsec-policies

      - name: Render chart
        run: >-
          helm template appsec-policies ./charts/appsec-policies > /dev/null

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Initialize chart repository branch
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            git switch --orphan gh-pages
            touch .nojekyll
            git add .nojekyll
            git commit --message "Initialize Helm chart repository"
            git push origin gh-pages
            git switch --detach "$GITHUB_SHA"
          fi

      - name: Release chart
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
