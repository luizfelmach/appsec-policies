apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: appsec-e2e
spec:
  ingressClassName: appsec-kong
  rules:
    - host: prevent.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
    - host: detect.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
